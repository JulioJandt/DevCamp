version: '3.8'

services:
  # 1. Contêiner do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: devcamp_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: devcamp
    ports:
      - "5432:5432"

  # 2. Contêiner da API Node.js
  api:
    build: .
    container_name: devcamp_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=devcamp
      - DB_PORT=5432
    depends_on:
      - db